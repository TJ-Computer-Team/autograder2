{% extends "base.html" %}

{% load static %}

{% block title %}TJIOI Login{% endblock title %}

{% block content %}
{% include "partials/header.html" %}

<div class="mx-auto max-w-md px-4 py-10">
  <div>
    <div class="title text-2xl font-semibold text-neutral-900 dark:text-neutral-100">TJIOI Login</div>
    {% if error %}
      <div class="mt-4 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800 dark:border-red-700/80 dark:bg-red-950/80 dark:text-red-200">{{ error }}</div>
    {% endif %}
    <form action="{% url 'tjioi:login' %}" method="POST" class="mt-6 space-y-5 text-neutral-900 dark:text-neutral-100">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium" for="id">ID</label>
        <input class="mt-2 w-full rounded-xl border border-neutral-300 px-4 py-3 text-sm outline-none transition focus:border-neutral-400 focus:ring-2 focus:ring-neutral-300 dark:border-neutral-700 dark:text-neutral-100" type="text" name="id" id="id" maxlength="100" required />
      </div>
      <div>
        <label class="block text-sm font-medium" for="password">Password</label>
        <input class="mt-2 w-full rounded-xl border border-neutral-300 px-4 py-3 text-sm outline-none transition focus:border-neutral-400 focus:ring-2 focus:ring-neutral-300 dark:border-neutral-700 dark:text-neutral-100" type="password" name="password" id="password" maxlength="100" required />
      </div>
      <button class="button inline-flex rounded-xl px-6 py-3 text-sm font-semibold" type="submit">Submit</button>
    </form>
  </div>
</div>

{% endblock content %}
